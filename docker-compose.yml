services:

  db-linares:
    image: mariadb:11.4
    container_name: db-linares
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    ports:
      - "3307:3306"
    volumes:
      - datos-libreria:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - linares

  api-linares:
    build: .
    image: libreria-api:1.0
    container_name: api-linares
    restart: unless-stopped
    depends_on:
      db-linares:
        condition: service_healthy
    environment:
      DB_HOST: db-linares
      DB_PORT: 3306
    ports:
      - "8080:8080"
    networks:
      - linares

volumes:
  datos-libreria:

networks:
  linares:
    external: true
