spring.application.name=libreria-api
server.port=8080

# ---------- Base de datos ----------
# Valores por defecto = ejecutar desde Eclipse contra el contenedor (puerto 3307 del host).
# Dentro de Docker se sobrescriben con variables de entorno (DB_HOST=db-linares, DB_PORT=3306).
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:libreria}
spring.datasource.username=${DB_USER:linares}
spring.datasource.password=${DB_PASSWORD:linares123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---------- JPA ----------
# "none": las tablas las crea el script libreria.sql, Hibernate no las toca.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Jackson: fechas como "1967-05-30" ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
